include:
  - project: konradodwrot/cross-repo/misc
    ref: $GRP_KO_VAR_MISC_REF
    file: shared/ci/templates/EmitEvents.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - apply
  - notify

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64-small

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  MISC_REF: $GRP_KO_VAR_MISC_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF
  GITLAB_TOKEN: $REPO_VAR_CI_VARIABLES_TOKEN

#[why] terraform only warns on a value for an undeclared variable, so the generated files need a
#   check that actually fails: a typo'd key would otherwise create nothing and pass green
validate-tfvars:
  stage: validate
  image: $CI_IMAGE
  script:
    - ruby ci/validate-tfvars.rb
    - terraform fmt -check -recursive modules/

plan:
  stage: validate
  image: $CI_IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - terragrunt run-all plan --terragrunt-non-interactive --terragrunt-working-dir live

apply:
  stage: apply
  image: $CI_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - terragrunt run-all apply --terragrunt-non-interactive --terragrunt-working-dir live

emit-events:
  extends: .emit-events
  stage: notify
##[<] 🤖🤖
