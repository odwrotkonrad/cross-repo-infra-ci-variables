include:
  - project: konradodwrot/cross-repo/misc
    ref: $GRP_KO_VAR_MISC_REF
    file: shared/ci/templates/EmitEvents.gitlab-ci.yml

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

stages:
  - validate
  - apply
  - notify

default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure
  tags:
    - gke-linux-amd64-small

variables:
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  MISC_REF: $GRP_KO_VAR_MISC_REF
  PROSE_ASSETS_REF: $GRP_KO_VAR_PROSE_ASSETS_REF
  PROSE_SPEC_REF: $GRP_KO_VAR_PROSE_SPEC_REF
  AI_TOOLS_CONFIGS_REF: $GRP_KO_VAR_AI_TOOLS_CONFIGS_REF
  CHE_SCHEMA_REF: $GRP_KO_VAR_CHE_SCHEMA_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF
  GITLAB_TOKEN: $REPO_UNPROTECTED_VAR_BOT_CI_VARIABLES_TOKEN

#[why] terraform only warns on a value for an undeclared variable, so the generated files need a
#   check that actually fails: a typo'd key would otherwise create nothing and pass green
validate-tfvars:
  rules:
    - changes:
        - live/**/*
        - modules/**/*
        - templates/**/*
        - ci/**/*
        - .gitlab-ci.yml
  stage: validate
  image: $CI_IMAGE
  script:
    - ruby ci/validate-tfvars.rb
    - terraform fmt -check -recursive modules/

plan:
  stage: validate
  image: $CI_IMAGE
  resource_group: tfstate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - live/**/*
        - modules/**/*
        - templates/**/*
        - ci/**/*
        - .gitlab-ci.yml
  script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - terragrunt run --all init --non-interactive --parallelism 1 --working-dir live
    - terragrunt run --all plan --non-interactive --working-dir live

#[why] the applied tfvars ARE the desired state: report them so automation can shape them into the
#   desired graph. A plain file artifact, folded into the one terminal send by emit-events
apply:
  stage: apply
  image: $CI_IMAGE
  resource_group: tfstate
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - live/**/*
        - modules/**/*
        - templates/**/*
        - ci/**/*
        - .gitlab-ci.yml
  script:
    - mkdir -p "$TF_PLUGIN_CACHE_DIR"
    - terragrunt run --all init --non-interactive --parallelism 1 --working-dir live
    - terragrunt run --all apply --non-interactive --working-dir live
    - ruby ci/desired-versions.rb extra-events.json
  artifacts:
    paths:
      - extra-events.json

emit-events:
  extends: .emit-events
  stage: notify
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - live/**/*
        - modules/**/*
        - templates/**/*
        - ci/**/*
        - .gitlab-ci.yml
  needs:
    - apply
